services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: souqi
      POSTGRES_USER: souqi
      POSTGRES_PASSWORD: souqi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souqi -d souqi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    volumes:
      - ./api:/app
      - media:/app/media
    command: ["gunicorn", "souqi.wsgi:application", "--bind", "0.0.0.0:8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
